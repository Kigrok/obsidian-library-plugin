name: Release Obsidian plugin

on:
    push:
        tags:
            - "*"

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            - name: Use Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "24.x"

            # Obsidian downloads the release whose tag equals manifest.json's version.
            - name: Check tag matches manifest version
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  version="$(node -p "require('./manifest.json').version")"
                  if [ "$tag" != "$version" ]; then
                      echo "Tag $tag does not match manifest.json version $version" >&2
                      exit 1
                  fi

            - name: Install dependencies
              run: npm ci

            # Tests stay local (gitignored); CI lints the source that ships.
            - name: Lint
              run: npx eslint 'src/**/*.ts'

            - name: Build plugin
              run: npm run build

            - name: Attest build artifacts
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css

            # A draft with the files built and attested above. The notes are
            # written and the draft published by hand; from then on immutable
            # releases lock the files and the tag. A release that already
            # exists fails this step instead of being replaced.
            - name: Create draft release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  gh release create "$tag" \
                      --draft \
                      --verify-tag \
                      --title="$tag" \
                      --generate-notes \
                      main.js manifest.json styles.css
