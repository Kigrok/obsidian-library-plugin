name: Check pull request

# Lint and build every pull request, so a broken change shows up before
# merge rather than when the release tag is pushed.
on:
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24.x"

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npx eslint 'src/**/*.ts'

            - name: Build plugin
              run: npm run build
