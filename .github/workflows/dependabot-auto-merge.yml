name: Dependabot auto-merge

# Patch and minor updates from Dependabot squash-merge on their own once the
# required "check" passes. Major updates wait for a review by hand.
# pull_request_target gives the token write access; the job never checks out
# or runs code from the pull request.
on:
    pull_request_target:

permissions: {}

jobs:
    auto-merge:
        if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'Kigrok/obsidian-library-plugin'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write

        steps:
            - name: Dependabot metadata
              id: meta
              uses: dependabot/fetch-metadata@v3

            - name: Enable auto-merge
              if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
              run: gh pr merge --auto --squash "$PR_URL"
