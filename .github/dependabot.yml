# Keeps the actions in .github/workflows current; npm security fixes come
# from Dependabot security updates, turned on in the repository settings.
# Each ecosystem arrives as one grouped pull request, so a merge never makes
# Dependabot rebase a sibling and run the checks again.
version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      # Wait a week after an action's release before proposing it.
      cooldown:
          default-days: 7
      groups:
          actions:
              patterns:
                  - "*"
      commit-message:
          prefix: ci

    # Version updates stay off (limit 0); this entry only shapes the security
    # updates: one pull request for all of them, titled like the rest.
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      open-pull-requests-limit: 0
      groups:
          npm-security:
              applies-to: security-updates
              patterns:
                  - "*"
      commit-message:
          prefix: chore
